# This compose file is intended to be for production
x-common-backend: &common-backend
  image: ${COMPOSE_DOCKER_IMAGE}
  user: 1000:1000
  networks:
    - traefik
    - bridge
  env_file: .env

services:
  backend:
    <<: *common-backend
    restart: always
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik"
      - "traefik.http.routers.django_template_project.entrypoints=websecure"
      - "traefik.http.routers.django_template_project.rule=Host(`${COMPOSE_DOMAIN_NAME}`)"
      - "traefik.http.services.django_template_project.loadbalancer.server.port=8010"
      - "traefik.http.routers.django_template_project.tls=true"
    command: "gunicorn django_template_project.wsgi -w 4 -b 0.0.0.0:8010"
    depends_on:
      - migrations
  migrations:
    <<: *common-backend
    restart: "no"

    command: "python manage.py migrate"
  collectstatic:
    <<: *common-backend
    restart: "no"
    command: "python manage.py collectstatic --no-input"
    volumes:
      - source: traefik_shared_static_files
        target: /app/public
        type: volume
        volume:
          subpath: "django_template_project"
    depends_on:
      - backend

volumes:
  static_files:
  traefik_shared_static_files:
    external: true


networks:
  traefik:
    external: true
  bridge:
